<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Control de Procesos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease;
    }

    body.bg-negro { background-color: #000000; }
    body.bg-verde { background-color: #15803d; }
    body.bg-rojo  { background-color: #b91c1c; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-nav {
      background: #334155;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .actions-bar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .btn-db-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
    }

    .btn-export { background: #059669; }
    .btn-delete { background: #dc2626; }

    .form-group { margin-bottom: 16px; }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-inicio { background: #22c55e; color: #000000; }
    .btn-finalizar { background: #ef4444; color: #ffffff; }
    .btn-guardar { background: #3b82f6; color: #ffffff; }

    .hidden { display: none !important; }

    #vista-db {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 65vh;
      margin-top: 10px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #334155;
    }

    th {
      background: #1e293b;
      position: sticky;
      top: 0;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-negro">

  <!-- VISTA PRINCIPAL -->
  <div id="vista-principal">
    <div class="header-bar">
      <span class="badge" id="contador-procesos">Procesos: 0</span>
      <button class="btn-nav" onclick="mostrarBD()">Ver Base de Datos</button>
    </div>

    <div class="form-group">
      <label for="titulo">Proceso / Título:</label>
      <input type="text" id="titulo" placeholder="Ej: Revisión CTP OT-5020">
    </div>

    <button id="btn-estado" class="btn-action btn-inicio" onclick="manejarEstado()">Inicio</button>

    <div id="seccion-final" class="hidden">
      <div class="form-group" style="margin-top: 20px;">
        <label for="descripcion">Descripción / Observación (Opcional):</label>
        <textarea id="descripcion" placeholder="Detalles, fallas o notas del proceso..."></textarea>
      </div>
      <button class="btn-action btn-guardar" onclick="guardarProceso()">Guardar Registro</button>
    </div>
  </div>

  <!-- VISTA BASE DE DATOS -->
  <div id="vista-db" class="hidden">
    <div class="header-bar">
      <h3>Historial de Registros</h3>
      <button class="btn-nav" onclick="volverInicio()">← Regresar</button>
    </div>

    <div class="actions-bar">
      <button class="btn-db-action btn-export" onclick="descargarCSV()">Descargar CSV</button>
      <button class="btn-db-action btn-delete" onclick="eliminarRegistroPorID()">Eliminar Registro</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Fecha Inicio</th>
            <th>Hora Inicio</th>
            <th>Fecha Fin</th>
            <th>Hora Fin</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody id="tabla-cuerpo">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let estadoActual = 'IDLE';
    let tiempoInicio = {};
    let tiempoFin = {};

    // Obtención de Fecha y Hora por separado en UTC-5
    function obtenerFechaHoraSeparadaUTC5() {
      const fechaObj = new Date();
      
      const opcionesFecha = { timeZone: 'America/Lima', year: 'numeric', month: '2-digit', day: '2-digit' };
      const opcionesHora = { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };

      const fechaStr = fechaObj.toLocaleDateString('es-PE', opcionesFecha);
      const horaStr = fechaObj.toLocaleTimeString('es-PE', opcionesHora);

      return { fecha: fechaStr, hora: horaStr };
    }

    function actualizarContador() {
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      document.getElementById('contador-procesos').innerText = `Procesos: ${data.length}`;
    }

    function manejarEstado() {
      const btn = document.getElementById('btn-estado');
      const inputTitulo = document.getElementById('titulo');

      if (estadoActual === 'IDLE') {
        if (!inputTitulo.value.trim()) {
          alert('Por favor ingresa un título o nombre de proceso');
          return;
        }

        tiempoInicio = obtenerFechaHoraSeparadaUTC5();
        estadoActual = 'EN_CURSO';
        
        document.body.className = 'bg-verde';
        btn.innerText = 'Finalizar';
        btn.className = 'btn-action btn-finalizar';
        inputTitulo.disabled = true;

      } else if (estadoActual === 'EN_CURSO') {
        tiempoFin = obtenerFechaHoraSeparadaUTC5();
        estadoActual = 'FINALIZADO';

        document.body.className = 'bg-rojo';
        btn.classList.add('hidden');
        document.getElementById('seccion-final').classList.remove('hidden');
      }
    }

    function guardarProceso() {
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      
      // Asignación de ID correlativo
      const proximoID = data.length > 0 ? Math.max(...data.map(d => d.id)) + 1 : 1;

      const nuevoRegistro = {
        id: proximoID,
        titulo: document.getElementById('titulo').value.trim(),
        fechaInicio: tiempoInicio.fecha,
        horaInicio: tiempoInicio.hora,
        fechaFin: tiempoFin.fecha,
        horaFin: tiempoFin.hora,
        descripcion: document.getElementById('descripcion').value.trim() || '---'
      };

      data.push(nuevoRegistro);
      localStorage.setItem('db_procesos', JSON.stringify(data));

      reiniciarPantalla();
    }

    function reiniciarPantalla() {
      estadoActual = 'IDLE';
      tiempoInicio = {};
      tiempoFin = {};

      document.body.className = 'bg-negro';
      
      const inputTitulo = document.getElementById('titulo');
      inputTitulo.value = '';
      inputTitulo.disabled = false;

      document.getElementById('descripcion').value = '';
      document.getElementById('seccion-final').classList.add('hidden');

      const btn = document.getElementById('btn-estado');
      btn.innerText = 'Inicio';
      btn.className = 'btn-action btn-inicio';
      btn.classList.remove('hidden');

      actualizarContador();
    }

    function mostrarBD() {
      document.getElementById('vista-principal').classList.add('hidden');
      document.getElementById('vista-db').classList.remove('hidden');
      document.body.className = 'bg-negro';

      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      const tbody = document.getElementById('tabla-cuerpo');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay procesos registrados.</td></tr>';
        return;
      }

      data.slice().reverse().forEach((r) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>#${r.id}</b></td>
          <td><b>${r.titulo}</b></td>
          <td>${r.fechaInicio}</td>
          <td>${r.horaInicio}</td>
          <td>${r.fechaFin}</td>
          <td>${r.horaFin}</td>
          <td>${r.descripcion}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function volverInicio() {
      document.getElementById('vista-db').classList.add('hidden');
      document.getElementById('vista-principal').classList.remove('hidden');
      
      if (estadoActual === 'IDLE') document.body.className = 'bg-negro';
      else if (estadoActual === 'EN_CURSO') document.body.className = 'bg-verde';
      else if (estadoActual === 'FINALIZADO') document.body.className = 'bg-rojo';
    }

    function eliminarRegistroPorID() {
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      if (data.length === 0) {
        alert('No hay registros para eliminar.');
        return;
      }

      const idIngresado = prompt('Ingresa el número de ID del registro que deseas eliminar:');
      if (idIngresado === null || idIngresado.trim() === '') return;

      const idNumerico = parseInt(idIngresado, 10);
      const existe = data.some(item => item.id === idNumerico);

      if (!existe) {
        alert(`No se encontró ningún registro con el ID: ${idIngresado}`);
        return;
      }

      if (confirm(`¿Estás seguro de eliminar el registro #${idNumerico}?`)) {
        const dataFiltrada = data.filter(item => item.id !== idNumerico);
        localStorage.setItem('db_procesos', JSON.stringify(dataFiltrada));
        mostrarBD();
        actualizarContador();
      }
    }

    function descargarCSV() {
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      if (data.length === 0) {
        alert('No hay datos para exportar.');
        return;
      }

      // Estructura CSV con columnas separadas
      let csvContent = '\uFEFF'; // BOM para soportar tildes y caracteres especiales en Excel
      csvContent += 'ID,Titulo,Fecha_Inicio,Hora_Inicio,Fecha_Fin,Hora_Fin,Descripcion\n';

      data.forEach(r => {
        const descLimpia = `"${r.descripcion.replace(/"/g, '""')}"`;
        const tituloLimpio = `"${r.titulo.replace(/"/g, '""')}"`;
        csvContent += `${r.id},${tituloLimpio},${r.fechaInicio},${r.horaInicio},${r.fechaFin},${r.horaFin},${descLimpia}\n`;
      });

      // Generación del nombre de archivo con marca de tiempo actual (UTC-5)
      const ahora = new Date();
      const opciones = { timeZone: 'America/Lima', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      const partes = new Intl.DateTimeFormat('es-PE', opciones).formatToParts(ahora);
      
      const mapa = {};
      partes.forEach(p => mapa[p.type] = p.value);
      const timestampNombre = `${mapa.year}-${mapa.month}-${mapa.day}_${mapa.hour}-${mapa.minute}-${mapa.second}`;

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = `control_de_procesos_actualizado_${timestampNombre}.csv`;
      enlace.click();
      URL.revokeObjectURL(url);
    }

    actualizarContador();
  </script>
</body>
</html>
