<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Control de Procesos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease;
    }

    /* Estados de fondo */
    body.bg-negro { background-color: #000000; }
    body.bg-verde { background-color: #15803d; }
    body.bg-rojo  { background-color: #b91c1c; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-nav {
      background: #334155;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-group { margin-bottom: 16px; }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-inicio { background: #22c55e; color: #000000; }
    .btn-finalizar { background: #ef4444; color: #ffffff; }
    .btn-guardar { background: #3b82f6; color: #ffffff; }

    .hidden { display: none !important; }

    /* Vista de Base de Datos */
    #vista-db {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .table-container {
      overflow-y: auto;
      max-height: 70vh;
      margin-top: 10px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
    }

    th {
      background: #1e293b;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body class="bg-negro">

  <!-- PANTALLA PRINCIPAL -->
  <div id="vista-principal">
    <div class="header-bar">
      <span class="badge" id="contador-procesos">Procesos: 0</span>
      <button class="btn-nav" onclick="mostrarBD()">Ver Base de Datos</button>
    </div>

    <div class="form-group">
      <label for="titulo">Proceso / Título:</label>
      <input type="text" id="titulo" placeholder="Ej: Revisión CTP OT-5020">
    </div>

    <!-- Botón de Estado Dinámico -->
    <button id="btn-estado" class="btn-action btn-inicio" onclick="manejarEstado()">Inicio</button>

    <!-- Sección que se habilita al finalizar -->
    <div id="seccion-final" class="hidden">
      <div class="form-group" style="margin-top: 20px;">
        <label for="descripcion">Descripción / Observación (Opcional):</label>
        <textarea id="descripcion" placeholder="Detalles, fallas o notas del proceso..."></textarea>
      </div>
      <button class="btn-action btn-guardar" onclick="guardarProceso()">Guardar Registro</button>
    </div>
  </div>

  <!-- PANTALLA VISTA PREVIA BASE DE DATOS -->
  <div id="vista-db" class="hidden">
    <div class="header-bar">
      <h3>Historial de Registros</h3>
      <button class="btn-nav" onclick="volverInicio()">← Regresar</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Inicio (UTC-5)</th>
            <th>Fin (UTC-5)</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody id="tabla-cuerpo">
          <!-- Registros dinámicos -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Variables de control de estado
    let estadoActual = 'IDLE'; // IDLE -> EN_CURSO -> FINALIZADO
    let tiempoInicioUTC5 = '';
    let tiempoFinUTC5 = '';

    // Función para obtener fecha y hora local UTC-5
    function obtenerFechaHoraUTC5() {
      const fecha = new Date();
      return fecha.toLocaleString('es-PE', {
        timeZone: 'America/Lima',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
    }

    function actualizarContador() {
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      document.getElementById('contador-procesos').innerText = `Procesos: ${data.length}`;
    }

    function manejarEstado() {
      const btn = document.getElementById('btn-estado');
      const inputTitulo = document.getElementById('titulo');

      if (estadoActual === 'IDLE') {
        if (!inputTitulo.value.trim()) {
          alert('Por favor ingresa un título o nombre de proceso');
          return;
        }

        // Cambio a Estado EN_CURSO (Verde)
        tiempoInicioUTC5 = obtenerFechaHoraUTC5();
        estadoActual = 'EN_CURSO';
        
        document.body.className = 'bg-verde';
        btn.innerText = 'Finalizar';
        btn.className = 'btn-action btn-finalizar';
        inputTitulo.disabled = true;

      } else if (estadoActual === 'EN_CURSO') {
        // Cambio a Estado FINALIZADO (Rojo)
        tiempoFinUTC5 = obtenerFechaHoraUTC5();
        estadoActual = 'FINALIZADO';

        document.body.className = 'bg-rojo';
        btn.classList.add('hidden');
        document.getElementById('seccion-final').classList.remove('hidden');
      }
    }

    function guardarProceso() {
      const nuevoRegistro = {
        id: Date.now(),
        titulo: document.getElementById('titulo').value.trim(),
        inicio: tiempoInicioUTC5,
        fin: tiempoFinUTC5,
        descripcion: document.getElementById('descripcion').value.trim() || '---'
      };

      // Guardar en Storage Local
      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      data.push(nuevoRegistro);
      localStorage.setItem('db_procesos', JSON.stringify(data));

      reiniciarPantalla();
    }

    function reiniciarPantalla() {
      estadoActual = 'IDLE';
      tiempoInicioUTC5 = '';
      tiempoFinUTC5 = '';

      // Reset de estilos y visibilidad
      document.body.className = 'bg-negro';
      
      const inputTitulo = document.getElementById('titulo');
      inputTitulo.value = '';
      inputTitulo.disabled = false;

      document.getElementById('descripcion').value = '';
      document.getElementById('seccion-final').classList.add('hidden');

      const btn = document.getElementById('btn-estado');
      btn.innerText = 'Inicio';
      btn.className = 'btn-action btn-inicio';
      btn.classList.remove('hidden');

      actualizarContador();
    }

    function mostrarBD() {
      document.getElementById('vista-principal').classList.add('hidden');
      document.getElementById('vista-db').classList.remove('hidden');
      document.body.className = 'bg-negro';

      const data = JSON.parse(localStorage.getItem('db_procesos') || '[]');
      const tbody = document.getElementById('tabla-cuerpo');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay procesos registrados.</td></tr>';
        return;
      }

      data.slice().reverse().forEach((r, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${data.length - index}</td>
          <td><b>${r.titulo}</b></td>
          <td>${r.inicio}</td>
          <td>${r.fin}</td>
          <td>${r.descripcion}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function volverInicio() {
      document.getElementById('vista-db').classList.add('hidden');
      document.getElementById('vista-principal').classList.remove('hidden');
      
      // Restaurar color según el estado en el que se encontraba
      if (estadoActual === 'IDLE') document.body.className = 'bg-negro';
      else if (estadoActual === 'EN_CURSO') document.body.className = 'bg-verde';
      else if (estadoActual === 'FINALIZADO') document.body.className = 'bg-rojo';
    }

    // Inicializar contador al cargar
    actualizarContador();
  </script>
</body>
</html>
